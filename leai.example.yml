# ==============================================================================
# Arquivo de Exemplo de Configuração - LEAI (Oracle Database Documentation CLI)
# Copie este arquivo para leai.yml e ajuste conforme o seu ambiente.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. CONEXÃO COM O BANCO DE DADOS ORACLE (DSN)
# ------------------------------------------------------------------------------
# Aceita a sintaxe URL oracle:// ou a string de conexão nativa do cx_Oracle/oracledb.
# Suporta variáveis de ambiente no formato ${NOME_DA_VARIAVEL}.
dsn: "oracle://${DB_USER}:${DB_PASS}@${DB_HOST}:1521/${DB_SERVICE}"

# Exemplo estático:
# dsn: "oracle://meu_usuario:minha_senha@localhost:1521/ORCLPDB1"

# ------------------------------------------------------------------------------
# 2. DEFINIÇÃO DOS SCHEMAS A EXTRAIR E DOCUMENTAR
# ------------------------------------------------------------------------------
# Opção A: Schema único (Modo tradicional)
schemas:
  - HR

# Opção B: Lista de múltiplos schemas específicos
# schemas:
#   - HR
#   - SALES
#   - FINANCEIRO

# Opção C: TODOS os schemas do banco (Ignora schemas internos do Oracle/SYS)
# Requer usuário com privilégio SELECT ANY DICTIONARY ou role DBA.
# schemas: "ALL"

# ------------------------------------------------------------------------------
# 3. DIRETORES DO PIPELINE
# ------------------------------------------------------------------------------
rawPath: "./raw"                  # Snapshot técnico puro em formato JSON
annotationsPath: "./annotations"  # Camada editável de anotações de negócio em YAML
docPath: "./docs"                  # Documentação final compilada em Markdown para RAG

# ------------------------------------------------------------------------------
# 4. FILTROS DE OBJETOS (Inclusão e Exclusão)
# ------------------------------------------------------------------------------
# Suporta caracteres curinga do padrão LIKE do Oracle (ex: VENDAS_%, BIN$%)
include:
  - FUNCIONARIOS
  - VENDAS_%

exclude:
  - BIN$%
  - SYS_%

# ------------------------------------------------------------------------------
# 5. TIPOS DE OBJETOS A SEREM PROCESSADOS
# ------------------------------------------------------------------------------
# Descomente apenas as categorias de objetos que deseja incluir na extração:
object_types:
  - tables
  - views
  - mviews
  - procedures
  - functions
  - packages
  - types
  - triggers
  - sequences
  - indexes
  - synonyms

# ------------------------------------------------------------------------------
# 6. CONFIGURAÇÃO DE IA (LLMs para Auto-Enriquecimento e Assistente)
# ------------------------------------------------------------------------------
ai:
  default_provider: "ollama" # "ollama", "openai", "gemini", "anthropic", "deepseek", "qwen", "kimi", "grok"
  temperature: 0.2
  providers:
    ollama:
      base_url: "http://localhost:11434/v1"
      model: "qwen2.5-coder:latest"
    openai:
      api_key: "${OPENAI_API_KEY}"
      model: "gpt-4o-mini"
    gemini:
      api_key: "${GEMINI_API_KEY}"
      model: "gemini-1.5-flash"
    anthropic:
      api_key: "${ANTHROPIC_API_KEY}"
      model: "claude-3-5-sonnet-20241022"
    deepseek:
      api_key: "${DEEPSEEK_API_KEY}"
      base_url: "https://api.deepseek.com/v1"
      model: "deepseek-chat"
    qwen:
      api_key: "${DASHSCOPE_API_KEY}"
      base_url: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
      model: "qwen-plus"
    kimi:
      api_key: "${MOONSHOT_API_KEY}"
      base_url: "https://api.moonshot.cn/v1"
      model: "moonshot-v1-8k"
    grok:
      api_key: "${GROK_API_KEY}"
      base_url: "https://api.x.ai/v1"
      model: "grok-2-latest"

# ------------------------------------------------------------------------------
# 7. SINCRONIZAÇÃO COM GIT / GITLAB
# ------------------------------------------------------------------------------
git:
  enabled: false                                 # Ativa comandos /git e leai git
  remote_url: "${GIT_REMOTE_URL}"                # URL do repositório remoto (GitLab, GitHub, etc.)
  branch: "main"                                 # Branch de rastreamento
  author_name: "LEAI Bot"                        # Nome do autor para commits automáticos
  author_email: "leai@local"                     # E-mail do autor para commits automáticos
  auto_sync: false                               # Sincronização automática após extração/compilação
  tracked_paths:                                 # Pastas e arquivos gerenciados pelo versionamento
    - "annotations"
    - "docs"
    - "raw"
    - "leai.yml"

# ------------------------------------------------------------------------------
# 8. ARMAZENAMENTO DISTRIBUÍDO / OBJECT STORAGE (SeaweedFS S3)
# ------------------------------------------------------------------------------
storage:
  seaweedfs:
    enabled: false                                 # Se true, os comandos usam SeaweedFS por padrão sem precisar de --seaweed
    endpoint_url: "${SEAWEEDFS_ENDPOINT:-http://localhost:8333}" # Endpoint do gateway S3 do SeaweedFS
    bucket: "leai"                                 # Nome do bucket S3 onde os metadados serão persistidos
    access_key: "${SEAWEEDFS_ACCESS_KEY}"          # Access Key S3 (opcional se anônimo)
    secret_key: "${SEAWEEDFS_SECRET_KEY}"          # Secret Key S3 (opcional se anônimo)
    region_name: "us-east-1"
    raw_prefix: "raw"                              # Prefixo/pasta no bucket para os snapshots JSON brutos
    annotations_prefix: "annotations"              # Prefixo/pasta no bucket para os arquivos YAML de anotações
    auto_create_bucket: true                       # Cria o bucket automaticamente caso ainda não exista
    no_cache: false                                # Se true, opera em modo 100% remoto: não grava arquivos locais em rawPath
    incremental: true                              # Se true, calcula hash SHA-256 e só cria novas versões no S3 para objetos modificados



