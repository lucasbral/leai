[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leai"
version = "0.2.11"
description = "Oracle Database reverse engineering, lineage tracing, impact analysis, and RAG/LLM documentation engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Lucas Bral" }
]
keywords = [
  "oracle",
  "database",
  "rag",
  "llm",
  "plsql",
  "lineage",
  "documentation",
  "copilot",
  "vector-db"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Database",
  "Topic :: Software Development :: Documentation",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License"
]
dependencies = [
  "oracledb>=2.2.0",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "PyYAML>=6.0.1",
  "pydantic>=2.7.0",
  "prompt_toolkit>=3.0.40",
  "boto3>=1.34.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.4.0"
]

[project.urls]
Homepage = "https://github.com/lucasbral/leai"
Repository = "https://github.com/lucasbral/leai"
Issues = "https://github.com/lucasbral/leai/issues"

[project.scripts]
leai = "leai.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["leai*"]

[tool.setuptools.package-data]
"leai" = ["web/static/*"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
